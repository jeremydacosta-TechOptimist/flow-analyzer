[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-analyzer"
version = "1.0.0"
description = "Offline NetFlow v5/v9 and IPFIX decoder and traffic analyzer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jeremy da Costa", email = "357285436+jeremydacosta-TechOptimist@users.noreply.github.com" },
]
keywords = ["netflow", "ipfix", "network-analysis", "traffic-analysis", "flow-monitoring"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
flowanalyzer = "flowanalyzer.cli:main"

[project.urls]
Homepage = "https://github.com/jeremydacosta-TechOptimist/flow-analyzer"
Issues = "https://github.com/jeremydacosta-TechOptimist/flow-analyzer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
